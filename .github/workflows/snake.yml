# Draws the monochrome contribution snake used in the profile README.
# Output lands on the `output` branch:
#   https://raw.githubusercontent.com/Isaackjoshua/Isaackjoshua/output/snake-light.svg
#   https://raw.githubusercontent.com/Isaackjoshua/Isaackjoshua/output/snake-dark.svg
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Greyscale dots to match the dithered pixel header.
          outputs: |
            dist/snake-light.svg?color_snake=#000000&color_dots=#ebedf0,#c4c4c4,#8a8a8a,#505050,#1a1a1a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#3a3a3a,#6e6e6e,#a8a8a8,#f0f0f0

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
