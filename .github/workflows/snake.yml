# Draws the monochrome contribution snake used in the profile README.
# Output lands on the `output` branch:
#   https://raw.githubusercontent.com/Isaackjoshua/Isaackjoshua/output/snake-light.svg
#   https://raw.githubusercontent.com/Isaackjoshua/Isaackjoshua/output/snake-dark.svg
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Violet contribution squares with a pink snake, matching the README accents.
          outputs: |
            dist/snake-light.svg?color_snake=#EC4899&color_dots=#ebedf0,#c4b5fd,#a78bfa,#8b5cf6,#6d28d9
            dist/snake-dark.svg?palette=github-dark&color_snake=#F778BA&color_dots=#161b22,#3c1e70,#6e40c9,#8957e5,#d2a8ff

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
