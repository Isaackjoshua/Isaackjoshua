name: Generate stats cards

on:
  schedule:
    - cron: "30 0 * * *"   # daily at 00:30 UTC
  workflow_dispatch:        # lets you run it by hand
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=D2A8FF&text_color=C9D1D9&icon_color=F778BA&ring_color=D2A8FF
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-orga-action@v2
        with:
          card: top-lang
          options: username=${{ github.repository_owner
}}&layout=compact&langs_color=0D1117&title_color=D2A8FF&text_color=C9D1D9
          path: profile/
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error:

      - name: Commit car
        run: |
          git config use
          git config user.email
"41898282+github-actionsom"
          git add profile/*.svg
          git commit -m  0
          git push
